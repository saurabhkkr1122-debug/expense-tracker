<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header><h1>Expense Tracker</h1><p>Manage your money smartly</p></header>
    <section class="summary">
      <article class="card balance"><h3>Total Balance</h3><h2 id="balance">₹0.00</h2></article>
      <article class="card income"><h3>Total Income</h3><h2 id="income">₹0.00</h2></article>
      <article class="card expense"><h3>Total Expense</h3><h2 id="expense">₹0.00</h2></article>
    </section>
    <section class="panel">
      <h2>Add Transaction</h2>
      <form id="transactionForm">
        <input type="text" id="title" placeholder="Transaction title" maxlength="60" required>
        <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01" required>
        <select id="type"><option value="income">Income</option><option value="expense">Expense</option></select>
        <select id="category">
          <option>Food</option><option>Travel</option><option>Shopping</option>
          <option>Bills</option><option>Salary</option><option>Education</option><option>Other</option>
        </select>
        <input type="date" id="date" required>
        <button type="submit">Add Transaction</button>
      </form>
    </section>
    <section class="panel">
      <div class="history-header"><h2>Transaction History</h2>
        <select id="filter" aria-label="Filter transactions">
          <option value="all">All Transactions</option><option value="income">Income</option><option value="expense">Expenses</option>
        </select>
      </div>
      <input type="search" id="search" placeholder="Search by transaction title...">
      <div id="transactionList" aria-live="polite"></div>
    </section>
    <footer>Expense Tracker · Built with HTML, CSS &amp; JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
